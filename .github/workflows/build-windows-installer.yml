name: Build Windows test installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Development artifacts ONLY. No ability to create/publish GitHub Releases.
permissions:
  contents: read

jobs:
  windows-test-installer:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select build Python (NOT needed on end-user computers)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install and verify FFmpeg with bounded retries (PRIVATE test build)
        shell: pwsh
        run: |
          $toolRoot = 'C:\ProgramData\chocolatey\lib\ffmpeg\tools'
          $ready = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            if (Test-Path -LiteralPath $toolRoot) {
              $candidates = @(Get-ChildItem -LiteralPath $toolRoot -Filter ffmpeg.exe -Recurse -File -ErrorAction SilentlyContinue)
              foreach ($exe in $candidates) {
                $probe = Join-Path $exe.DirectoryName 'ffprobe.exe'
                if (Test-Path -LiteralPath $probe -PathType Leaf) {
                  & $exe.FullName -version 2>&1 | Out-Null
                  $ffmpegCode = $LASTEXITCODE
                  & $probe -version 2>&1 | Out-Null
                  if ($ffmpegCode -eq 0 -and $LASTEXITCODE -eq 0) { $ready = $true; break }
                }
              }
            }
            if ($ready) { break }
            Write-Host "FFmpeg dependency installation attempt $attempt of 4..."
            choco install ffmpeg --version=9.0.2 -y --no-progress
            $installExit = $LASTEXITCODE
            if ($attempt -lt 4) {
              Write-Warning "FFmpeg installation returned $installExit; verifying and retrying if necessary."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $ready) {
            # Verify one final time after the fourth installation attempt.
            $candidates = @(Get-ChildItem -LiteralPath $toolRoot -Filter ffmpeg.exe -Recurse -File -ErrorAction SilentlyContinue)
            foreach ($exe in $candidates) {
              $probe = Join-Path $exe.DirectoryName 'ffprobe.exe'
              if (Test-Path -LiteralPath $probe -PathType Leaf) {
                & $exe.FullName -version 2>&1 | Out-Null
                $ffmpegCode = $LASTEXITCODE
                & $probe -version 2>&1 | Out-Null
                if ($ffmpegCode -eq 0 -and $LASTEXITCODE -eq 0) { $ready = $true; break }
              }
            }
          }
          if (-not $ready) { throw 'Verified FFmpeg/ffprobe binaries unavailable after four attempts. Dependency feed may be down.' }
          'C:\ProgramData\chocolatey\bin' >> $env:GITHUB_PATH
          Write-Host 'Verified actual FFmpeg and ffprobe binaries. The build script excludes Chocolatey shims.'
      - name: Install official Inno Setup 7.1.0 (Authenticode checked)
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $file = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $file
          $signature = Get-AuthenticodeSignature -FilePath $file
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') {
            throw 'Inno Setup signature is invalid or publisher is unexpected.'
          }
          $proc = Start-Process -FilePath $file -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup installation failed: $($proc.ExitCode)" }
      - name: Run tests, build frozen executable, compile Inno installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -UseSystemFFmpeg -Installer
      - name: Install, smoke-test and uninstall the actual Windows setup
        shell: pwsh
        run: .\scripts\test_installer_windows.ps1
      - name: Prepare SHA-256 checksum manifest and build provenance
        shell: pwsh
        run: |
          $paths = @(
            'dist\installer\Velomux-Setup-0.2.2-preview-Win-x64.exe',
            'dist\Velomux-Windows-Portable-x64.zip'
          )
          $checksums = foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing verified output: $path" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          $checksums | Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Encoding utf8
          @(
            "GitHub run: $env:GITHUB_RUN_ID",
            "Commit: $env:GITHUB_SHA",
            "Runner: $env:RUNNER_OS",
            "Python:",
            (& python --version),
            "FFmpeg:",
            (& ffmpeg -version | Select-Object -First 1),
            "Installed build packages:",
            (& .\.venv\Scripts\python.exe -m pip freeze)
          ) | Set-Content -LiteralPath 'dist\BUILD_PROVENANCE.txt' -Encoding utf8
      - name: Upload verified Windows TEST artifacts (not public Releases)
        uses: actions/upload-artifact@v4
        with:
          name: Velomux-0.2.2-preview-Windows-x64-TEST
          path: |
            dist/installer/Velomux-Setup-0.2.2-preview-Win-x64.exe
            dist/Velomux-Windows-Portable-x64.zip
            dist/SHA256SUMS.txt
            dist/BUILD_PROVENANCE.txt
            dist/qt-gui-source.png
            dist/qt-gui-frozen.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload GUI screenshots separately for visual review
        uses: actions/upload-artifact@v4
        with:
          name: Velomux-0.2.2-preview-GUI-Review
          path: |
            dist/qt-gui-source.png
            dist/qt-gui-frozen.png
          if-no-files-found: error
          retention-days: 14
