name: Build Windows test installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Development artifacts ONLY. No ability to create/publish GitHub Releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-test-installer:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select build Python (NOT needed on end-user computers)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Fetch hash-pinned FFmpeg from GitHub Releases (private CI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-05-13-07/ffmpeg-n9.0.2-22-g46d8f462ee-win64-gpl-9.0.zip'
          $expected = '1385d57bd30c009fca25655f056680317dc9db3724cf082443bf8830223877cf'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-pinned-9.0.2.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'ffmpeg-pinned-9.0.2'
          Invoke-WebRequest -Uri $assetUrl -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive SHA256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          $ff = @(Get-ChildItem -LiteralPath $unpacked -Filter 'ffmpeg.exe' -Recurse -File)
          if ($ff.Count -ne 1) { throw "Expected one bundled ffmpeg.exe, found $($ff.Count)" }
          $peer = Join-Path $ff[0].DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $peer -PathType Leaf)) { throw 'ffprobe.exe missing in pinned FFmpeg distribution.' }
          $ffmpegVersion = & $ff[0].FullName -version 2>&1
          $ffmpegExit = $LASTEXITCODE
          $ffprobeVersion = & $peer -version 2>&1
          $ffprobeExit = $LASTEXITCODE
          if ($ffmpegExit -ne 0) { throw "Pinned ffmpeg.exe validation failed: $ffmpegExit" }
          if ($ffprobeExit -ne 0) { throw "Pinned ffprobe.exe validation failed: $ffprobeExit" }
          Write-Host $ffmpegVersion[0]
          Write-Host $ffprobeVersion[0]
          "FFMPEG_BIN_DIR=$($ff[0].DirectoryName)" >> $env:GITHUB_ENV
          $ff[0].DirectoryName >> $env:GITHUB_PATH
          Write-Host 'SHA-256 verified, fixed-release FFmpeg/ffprobe binaries staged (private test build).'
      - name: Install official Inno Setup 7.1.0 (Authenticode checked)
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $file = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $file
          $signature = Get-AuthenticodeSignature -FilePath $file
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') {
            throw 'Inno Setup signature is invalid or publisher is unexpected.'
          }
          $proc = Start-Process -FilePath $file -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup installation failed: $($proc.ExitCode)" }
      - name: Run tests, build frozen executable, compile Inno installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -UseSystemFFmpeg -FFmpegBinDirectory $env:FFMPEG_BIN_DIR -Installer
      - name: Install, smoke-test and uninstall the actual Windows setup
        shell: pwsh
        run: .\scripts\test_installer_windows.ps1
      - name: Prepare SHA-256 checksum manifest and build provenance
        shell: pwsh
        run: |
          $paths = @(
            'dist\installer\Velomux-Setup-0.3.1-preview-Win-x64.exe',
            'dist\Velomux-Windows-Portable-x64.zip'
          )
          $checksums = foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing verified output: $path" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          $checksums | Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Encoding utf8
          @(
            "GitHub run: $env:GITHUB_RUN_ID",
            "Commit: $env:GITHUB_SHA",
            "Runner: $env:RUNNER_OS",
            "Python:",
            (& python --version),
            "FFmpeg:",
            (& ffmpeg -version | Select-Object -First 1),
            "Installed build packages:",
            (& .\.venv\Scripts\python.exe -m pip freeze)
          ) | Set-Content -LiteralPath 'dist\BUILD_PROVENANCE.txt' -Encoding utf8
      - name: Upload verified Windows TEST artifacts (not public Releases)
        uses: actions/upload-artifact@v4
        with:
          name: Velomux-0.3.1-preview-Windows-x64-TEST
          path: |
            dist/installer/Velomux-Setup-0.3.1-preview-Win-x64.exe
            dist/Velomux-Windows-Portable-x64.zip
            dist/SHA256SUMS.txt
            dist/BUILD_PROVENANCE.txt
            dist/qt-gui-source.png
            dist/qt-gui-frozen.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload GUI screenshots separately for visual review
        uses: actions/upload-artifact@v4
        with:
          name: Velomux-0.3.1-preview-GUI-Review
          path: |
            dist/qt-gui-source.png
            dist/qt-gui-frozen.png
          if-no-files-found: error
          retention-days: 14
