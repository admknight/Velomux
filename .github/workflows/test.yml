name: Tests and source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install and verify FFmpeg (Windows CI with bounded retries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $choco = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $toolsRoot = Join-Path $choco 'lib\ffmpeg\tools'
          function Test-ActualFFmpeg {
            if (-not (Test-Path -LiteralPath $toolsRoot -PathType Container)) { return $false }
            foreach ($file in (Get-ChildItem -LiteralPath $toolsRoot -Filter 'ffmpeg.exe' -Recurse -File -ErrorAction SilentlyContinue)) {
              $probe = Join-Path $file.DirectoryName 'ffprobe.exe'
              if (-not (Test-Path -LiteralPath $probe -PathType Leaf)) { continue }
              & $file.FullName -version 2>&1 | Out-Null
              $ffmpegExit = $LASTEXITCODE
              & $probe -version 2>&1 | Out-Null
              if ($ffmpegExit -eq 0 -and $LASTEXITCODE -eq 0) { return $true }
            }
            return $false
          }
          $verified = Test-ActualFFmpeg
          for ($attempt = 1; $attempt -le 4 -and -not $verified; $attempt++) {
            Write-Host "FFmpeg dependency attempt $attempt of 4"
            choco install ffmpeg --version=9.0.2 -y --no-progress
            $verified = Test-ActualFFmpeg
            if (-not $verified -and $attempt -lt 4) {
              Write-Warning "FFmpeg not yet verified; retrying after backoff."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $verified) { throw 'FFmpeg/ffprobe binaries unavailable after four attempts; dependency feed may be unavailable.' }
          (Join-Path $choco 'bin') >> $env:GITHUB_PATH
          Write-Host 'Verified real FFmpeg and ffprobe executable binaries on Windows CI.'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static Python validation
        run: python -m py_compile engine.py modern_app.py app.py run.py cli.py toolchain.py
      - name: Engine tests
        run: python -m pytest -q tests
      - name: Real MP4-to-M4A, repair, MP3, and lossless image integration tests
        run: python run.py --media-integration-test
      - name: Construct the actual Qt interface (offscreen GUI smoke test)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run.py --gui-smoke-test
