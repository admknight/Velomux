name: Tests and source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch hash-pinned FFmpeg from GitHub Releases (Windows CI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-05-13-07/ffmpeg-n9.0.2-22-g46d8f462ee-win64-gpl-9.0.zip'
          $expected = '1385d57bd30c009fca25655f056680317dc9db3724cf082443bf8830223877cf'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-pinned-9.0.2.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'ffmpeg-pinned-9.0.2'
          Invoke-WebRequest -Uri $assetUrl -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive SHA256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          $ff = @(Get-ChildItem -LiteralPath $unpacked -Filter 'ffmpeg.exe' -Recurse -File)
          if ($ff.Count -ne 1) { throw "Expected one bundled ffmpeg.exe, found $($ff.Count)" }
          $peer = Join-Path $ff[0].DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $peer -PathType Leaf)) { throw 'ffprobe.exe missing in pinned FFmpeg distribution.' }
          $ffmpegVersion = & $ff[0].FullName -version 2>&1
          $ffmpegExit = $LASTEXITCODE
          $ffprobeVersion = & $peer -version 2>&1
          $ffprobeExit = $LASTEXITCODE
          if ($ffmpegExit -ne 0) { throw "Pinned ffmpeg.exe validation failed: $ffmpegExit" }
          if ($ffprobeExit -ne 0) { throw "Pinned ffprobe.exe validation failed: $ffprobeExit" }
          Write-Host $ffmpegVersion[0]
          Write-Host $ffprobeVersion[0]
          "FFMPEG_BIN_DIR=$($ff[0].DirectoryName)" >> $env:GITHUB_ENV
          $ff[0].DirectoryName >> $env:GITHUB_PATH
          Write-Host 'SHA-256 verified, fixed-release FFmpeg/ffprobe binaries staged (private test build).'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static Python validation
        run: python -m py_compile engine.py modern_app.py app.py run.py cli.py toolchain.py
      - name: Engine tests
        run: python -m pytest -q tests
      - name: Real MP4-to-M4A, repair, MP3, and lossless image integration tests
        run: python run.py --media-integration-test
      - name: Construct the actual Qt interface (offscreen GUI smoke test)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run.py --gui-smoke-test
