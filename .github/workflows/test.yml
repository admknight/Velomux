name: Tests and source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows CI - testing only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static Python validation
        run: python -m py_compile engine.py modern_app.py app.py run.py cli.py toolchain.py
      - name: Engine tests
        run: python -m pytest -q tests
      - name: Construct the actual Qt interface (offscreen GUI smoke test)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run.py --gui-smoke-test
